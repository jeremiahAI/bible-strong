plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.biblereaderviews'
version = '1.0.0'

android {
  namespace "expo.modules.biblereaderviews"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
